name: CI

# Every pull request and every push to main: install from the lockfile, build and typecheck the packages,
# run their tests (unit, browser with the runner's Google Chrome, tarball install), pack them, check the
# tarballs' hygiene and run `npm publish --dry-run` on each. No token, read-only. Main merges never carry
# [skip ci] (CONTRIBUTING.md): main is what a release tag points at, so it must have been checked.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changeset:
    # Every pull request that changes a package has a changeset (`pnpm changeset`, or `pnpm changeset --empty`
    # for a change users never see). The "Version packages" pull request consumes them and is exempt.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: A changeset for every changed package
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check the version (one 0.x version for all packages)
        run: node tools/packages-version.mjs
      - name: Build and typecheck
        run: pnpm typecheck
      - name: Test
        run: node --test --test-concurrency=2 "test/**/*.test.js"
      - name: Pack, install the tarballs into a consumer, check their hygiene
        env:
          FOLIWAKE_PRIVATE_NAMES: ${{ vars.FOLIWAKE_PRIVATE_NAMES }}
        run: pnpm check:tarballs
      - name: npm publish --dry-run (no token)
        run: |
          set -eu
          version=$(node tools/packages-version.mjs)
          tag=$(node tools/packages-version.mjs --dist-tag)
          for t in $(node tools/packages.mjs --tarballs "$version"); do
            npm publish ".tarballs/$t" --dry-run --access public --provenance=false --tag "$tag"
          done
