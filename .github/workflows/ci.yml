name: CI

# Every pull request and every push to main: install from the lockfile, build and typecheck the five packages,
# run their tests (unit, browser with the runner's Google Chrome, tarball install), pack them, check the
# tarballs' hygiene and run `npm publish --dry-run` on each. No token, read-only. Main merges never carry
# [skip ci] (CONTRIBUTING.md): main is what a release tag points at, so it must have been checked.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check the version (one 0.x version for all five)
        run: node tools/packages-version.mjs
      - name: Build and typecheck
        run: pnpm typecheck
      - name: Test
        run: node --test --test-concurrency=2 "test/**/*.test.js"
      - name: Pack, install the tarballs into a consumer, check their hygiene
        env:
          FOLIWAKE_PRIVATE_NAMES: ${{ vars.FOLIWAKE_PRIVATE_NAMES }}
        run: pnpm check:tarballs
      - name: npm publish --dry-run (no token)
        run: |
          set -eu
          version=$(node tools/packages-version.mjs)
          for p in blocks-contract client react server next; do
            npm publish ".tarballs/foliwake-$p-$version.tgz" --dry-run --access public --provenance=false
          done
