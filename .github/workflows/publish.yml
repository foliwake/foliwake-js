name: Publish

# Publishes the packages on npm (npmjs.com, public, with provenance) from a release tag v<version> on main,
# after the owner approves the `publish` job (README.md, "Releasing"). Agents never tag or publish.
#
#  - pack:    no token, contents: read. Checks the version (and the tag), builds, typechecks, runs the tests,
#             packs the tarballs in publish order, installs exactly those files into a throwaway consumer and
#             checks their hygiene (tools/check-package-tarballs.mjs), runs `npm publish --dry-run` on each
#             tarball and uploads them. A workflow_dispatch run with dry-run (the default) stops here.
#  - publish: only on a tag v<version> (push of the tag, or a dispatch on the tag with dry-run off). Runs in
#             the GitHub environment `packages-publish` (the owner's approval), checks that the tag points at a
#             commit on main, refuses a private repository (npm provenance needs a public one) and existing
#             versions, then publishes exactly the checked tarballs (checksums), in dependency order, with
#             `npm publish --provenance --access public` under the dist-tag of the version (`next` for a
#             release candidate v0.x.y-rc.N, `latest` otherwise) and the secret NPM_TOKEN.
# The packages and their order: tools/packages.mjs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, test, pack and npm publish --dry-run only; publish nothing'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    # Only this repository, only from main or a v tag: forks and other branches do nothing.
    if: >-
      github.repository == 'foliwake/foliwake-js' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check the version (one for all packages; equal to the tag on a tag run)
        id: version
        run: |
          set -eu
          tag=""
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; esac
          version=$(node tools/packages-version.mjs ${tag:+"$tag"})
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and typecheck
        run: pnpm typecheck
      - name: Test
        run: node --test --test-concurrency=2 "test/**/*.test.js"
      - name: Pack
        run: |
          set -eu
          node tools/pack.mjs "$RUNNER_TEMP/tarballs"
          ls -l "$RUNNER_TEMP/tarballs"
          (cd "$RUNNER_TEMP/tarballs" && sha256sum ./*.tgz | tee SHA256SUMS)
      - name: Install the tarballs into a consumer, use them, check their hygiene
        env:
          FOLIWAKE_PRIVATE_NAMES: ${{ vars.FOLIWAKE_PRIVATE_NAMES }}
        run: node tools/check-package-tarballs.mjs "$RUNNER_TEMP/tarballs"
      - name: npm publish --dry-run (no token)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          tag=$(node tools/packages-version.mjs --dist-tag)
          for t in $(node tools/packages.mjs --tarballs "$VERSION"); do
            npm publish "$RUNNER_TEMP/tarballs/$t" --dry-run --access public --provenance=false --tag "$tag"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    if: >-
      github.repository == 'foliwake/foliwake-js' && startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Owner setup (once, README.md "Releasing"): environment `packages-publish` with the owner as required
    # reviewer and a deployment tag rule `v*`; the secret NPM_TOKEN (environment secret preferred).
    environment: packages-publish
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - name: Refuse a private repository (npm provenance needs a public source repository)
        if: github.event.repository.private
        run: |
          echo "${{ github.repository }} is private: npm refuses provenance from a private repository." >&2
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag (v<version>, the commit being run, on main)
        run: |
          set -eu
          node tools/packages-version.mjs "$GITHUB_REF_NAME"
          tagged=$(git rev-parse "$GITHUB_REF^{commit}")
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "the tag points at $tagged, the run at $GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "$GITHUB_SHA is not on main: only reviewed main history is published" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: tarballs
      - name: Check the tarballs (the files pack checked)
        run: |
          set -eu
          cd tarballs
          sha256sum -c SHA256SUMS
          for t in $(node ../tools/packages.mjs --tarballs "$VERSION"); do
            test -f "$t" || { echo "missing $t" >&2; exit 1; }
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Refuse an existing version
        run: |
          set -eu
          for name in $(node tools/packages.mjs --names); do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; versions are never replaced." >&2
              exit 1
            fi
          done
      - name: Publish the checked tarballs (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          tag=$(node tools/packages-version.mjs --dist-tag)
          for t in $(node tools/packages.mjs --tarballs "$VERSION"); do
            npm publish "tarballs/$t" --provenance --access public --tag "$tag"
          done
