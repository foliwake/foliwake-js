# Hosted branch previews: every push to a branch other than main asks the
# Foliwake server to show exactly that commit as the branch preview
# https://<branch>--<site>[--<org>].<branch host domain>/: the branch's code over
# the site's saved preview content (the pages are not rebuilt against the
# branch's code). Deleting the branch disables its preview. Live and the
# site's preview are never touched; main is handled by production.yml with
# another key. This site has no build step: the server takes the code
# (components/, scripts/, styles/, site.yaml) from the pushed commit itself.
#
# INERT until enabled: every job is skipped unless the repository variable
# BRANCH_PREVIEWS_ENABLED is `true` and FOLIWAKE_SITE_ID is set. How to enable
# it: README.md, "Connect to a Foliwake server".
#
# Credentials (environment `branch-previews`, secret NAMES only):
#   BRANCH_PREVIEW_SSH_KEY, BRANCH_PREVIEW_KNOWN_HOSTS, BRANCH_PREVIEW_SSH_TARGET.
# The key is restricted on the server to the branch-preview forced command
# (update/delete one site's branch previews; it cannot release or roll back).
# Pushes of forks never run here; pull requests are not a trigger.
#
# Ordering: cancelling an older run is only an optimisation. The server checks
# that the commit is still the branch tip, and the engine checks the run
# sequence (github.run_id), so a delayed older run never replaces a newer one.
name: Branch preview
on:
  push:
    branches-ignore: [main]
  delete:
permissions:
  contents: read
concurrency:
  group: branch-preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preview:
    if: >-
      vars.BRANCH_PREVIEWS_ENABLED == 'true' &&
      vars.FOLIWAKE_SITE_ID != '' &&
      !github.event.repository.fork &&
      github.event_name == 'push' && !github.event.deleted && github.ref_type == 'branch' &&
      github.ref_name != 'main'
    environment: branch-previews
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the request
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SITE: ${{ vars.FOLIWAKE_SITE_ID }}
        run: |
          python3 -c 'import json, os; print(json.dumps({"action": "update", "branch": os.environ["BRANCH"], "revision": os.environ["SHA"], "sequence": int(os.environ["RUN_ID"]), "site": os.environ["SITE"]}))' > "$RUNNER_TEMP/request.json"
      - id: send
        uses: ./.github/actions/foliwake-request
        with:
          command: branch-preview
          request: ${{ runner.temp }}/request.json
          ssh-key: ${{ secrets.BRANCH_PREVIEW_SSH_KEY }}
          known-hosts: ${{ secrets.BRANCH_PREVIEW_KNOWN_HOSTS }}
          target: ${{ secrets.BRANCH_PREVIEW_SSH_TARGET }}
      - name: Report
        env:
          EXIT: ${{ steps.send.outputs.exit }}
        run: |
          python3 .github/scripts/foliwake-report.py branch-preview "$RUNNER_TEMP/foliwake-result.json"
          test "$EXIT" = 0
  delete:
    if: >-
      vars.BRANCH_PREVIEWS_ENABLED == 'true' &&
      vars.FOLIWAKE_SITE_ID != '' &&
      !github.event.repository.fork &&
      github.event_name == 'delete' && github.event.ref_type == 'branch' &&
      github.event.ref != 'main'
    environment: branch-previews
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the request
        env:
          BRANCH: ${{ github.event.ref }}
          RUN_ID: ${{ github.run_id }}
          SITE: ${{ vars.FOLIWAKE_SITE_ID }}
        run: |
          python3 -c 'import json, os; print(json.dumps({"action": "delete", "branch": os.environ["BRANCH"], "sequence": int(os.environ["RUN_ID"]), "site": os.environ["SITE"]}))' > "$RUNNER_TEMP/request.json"
      - id: send
        uses: ./.github/actions/foliwake-request
        with:
          command: branch-preview
          request: ${{ runner.temp }}/request.json
          ssh-key: ${{ secrets.BRANCH_PREVIEW_SSH_KEY }}
          known-hosts: ${{ secrets.BRANCH_PREVIEW_KNOWN_HOSTS }}
          target: ${{ secrets.BRANCH_PREVIEW_SSH_TARGET }}
      - name: Report
        env:
          EXIT: ${{ steps.send.outputs.exit }}
        run: |
          python3 .github/scripts/foliwake-report.py branch-preview "$RUNNER_TEMP/foliwake-result.json"
          test "$EXIT" = 0
