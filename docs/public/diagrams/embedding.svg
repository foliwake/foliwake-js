<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">Embedding: envelope, prepare, mount</title>
<desc id="desc">The browser opens /pages/x in your app. Your app's server reads /x.plain.html from the Foliwake origin with the credential and caches what it answered as the envelope. On every request preparePage checks and rewrites the body and returns FoliwakePageData. The browser renders the body with FoliwakePage, imports the blocks module through your app's code proxy, which fetches the immutable code release from the origin, and calls mountBlocks; blocks send events to your app.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<rect width="760" height="610" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="380" y="36" font-size="23" font-weight="700" fill="#0f172a">Envelope, prepare, mount</text>
<text x="380" y="62" font-size="15" fill="#475569">Cache what the origin answered; prepare it on every request; mount blocks in the browser.</text>

<!-- Columns -->
<rect x="18" y="88" width="244" height="462" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="32" y="110" text-anchor="start" font-size="14" font-weight="650" fill="#334155">Browser</text>
<rect x="298" y="88" width="240" height="462" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="312" y="110" text-anchor="start" font-size="14" font-weight="650" fill="#334155">Your app's server</text>
<rect x="574" y="88" width="168" height="462" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-dasharray="6 5"/>
<text x="588" y="110" text-anchor="start" font-size="14" font-weight="650" fill="#3730a3">Foliwake origin</text>

<!-- Row 1: envelope -->
<rect x="30" y="126" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="140" y="152" font-size="16" font-weight="650" fill="#0f172a">Open a page</text>
<text x="140" y="174" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/pages/x</text>
<path d="M252 158 H304" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="126" width="216" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="418" y="148" font-size="16" font-weight="650" fill="#0f172a">Envelope (cached)</text>
<text x="418" y="168" font-size="13" fill="#475569">body, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X-Code-Release</tspan>,</text>
<text x="418" y="184" font-size="13" fill="#475569">language, ETag</text>
<path d="M528 158 H580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="529" y="125" width="54" height="29" rx="4" fill="#f8fafc"/>
<text x="556" y="136" font-size="11" fill="#475569">with the</text>
<text x="556" y="150" font-size="11" fill="#475569">credential</text>
<rect x="586" y="126" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="658" y="152" font-size="16" font-weight="650" fill="#0f172a">Page</text>
<text x="658" y="174" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/x.plain.html</text>

<!-- Row 2: prepare -->
<path d="M418 192 V220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="226" width="216" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="418" y="250" font-size="16" font-weight="650" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">preparePage</text>
<text x="418" y="270" font-size="13" fill="#475569">check, rewrite, transform,</text>
<text x="418" y="287" font-size="13" fill="#475569">check again, per request</text>
<text x="418" y="306" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ FoliwakePageData</text>
<path d="M308 272 H256" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="226" width="220" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="140" y="266" font-size="14" font-weight="650" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;FoliwakePage page&gt;</text>
<text x="140" y="288" font-size="13" fill="#475569">renders the body first</text>

<!-- Row 3: code -->
<path d="M140 320 V348" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="354" width="220" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="140" y="378" font-size="15" font-weight="650" fill="#0f172a">Import the blocks module</text>
<text x="140" y="398" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/foliwake-code/cd_A/</text>
<text x="140" y="414" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scripts/blocks.js</text>
<path d="M252 392 H304" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="354" width="216" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="418" y="386" font-size="16" font-weight="650" fill="#0f172a">Code proxy</text>
<text x="418" y="408" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/foliwake-code</text>
<path d="M528 392 H580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="556" y="382" font-size="11" fill="#475569">proxy</text>
<rect x="586" y="354" width="144" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="658" y="378" font-size="16" font-weight="650" fill="#0f172a">Code release</text>
<text x="658" y="398" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cd_A</text>
<text x="658" y="416" font-size="13" fill="#64748b">immutable</text>

<!-- Row 4: mount -->
<path d="M140 432 V460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="466" width="220" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="140" y="492" font-size="12" font-weight="650" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mountBlocks(container, host)</text>
<text x="140" y="514" font-size="13" fill="#475569">blocks send events to your app</text>

<text x="380" y="584" font-size="14" fill="#475569">The browser never talks to the origin: no credential reaches it, and your CSP stays <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">script-src 'self'</tspan>.</text>
</g>
</svg>
