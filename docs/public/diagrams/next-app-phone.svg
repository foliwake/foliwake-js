<path d="M314 264 L322 264 Q330 264 330 272 L330 592" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
<path d="M314 360 L322 360 Q330 360 330 368 L330 592" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
<path d="M314 456 L322 456 Q330 456 330 464 L330 592" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
<g><rect x="20" y="112" width="320" height="64" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="34" y="128" width="32" height="32" rx="9.6" fill="#eef2f6"/><path transform="translate(40.7 134.7) scale(0.773)" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5zM3 9h18M6.5 6.5h.01M9 6.5h.01" fill="none" stroke="#475569" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="139.4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="650" fill="#0f172a" text-anchor="start">Browser</text>
<text x="78" y="158.2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">your app's pages</text></g>
<g><rect x="46" y="224" width="268" height="80" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="60" y="236.8" width="28" height="28" rx="8.4" fill="#d5f5ef"/><path transform="translate(65.9 242.6) scale(0.677)" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="255.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="start">/pages/&lt;path&gt;</text>
<text x="62" y="286.4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">reads <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.8">&lt;path&gt;.plain.html</tspan> (cached)</text></g>
<g><rect x="46" y="320" width="268" height="80" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="60" y="323.5" width="28" height="28" rx="8.4" fill="#d5f5ef"/><path transform="translate(65.9 329.4) scale(0.677)" d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="342.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="start">/foliwake-code/…</text>
<text x="62" y="373.2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">proxies the page's code</text>
<text x="62" y="391.7" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">release (blocks)</text></g>
<g><rect x="46" y="416" width="268" height="80" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="60" y="428.8" width="28" height="28" rx="8.4" fill="#d5f5ef"/><path transform="translate(65.9 434.6) scale(0.677)" d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM9 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM20 15l-4.5-4.5L6 20" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="447.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="start">/foliwake-media/…</text>
<text x="62" y="478.4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">proxies pictures</text></g>
<g><rect x="20" y="592" width="320" height="64" rx="14" fill="url(#tint-violet)" stroke="#a78bfa" stroke-opacity=".55" filter="url(#shadow)"/>
<rect x="34" y="608" width="32" height="32" rx="9.6" fill="#ede9fe"/><path transform="translate(40.7 614.7) scale(0.773)" d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.9 8.6 4.5 4.5 0 0 1 17.5 18.5z" fill="none" stroke="#6d28d9" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="619.4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="650" fill="#0f172a" text-anchor="start">Foliwake</text>
<text x="78" y="638.2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">live / preview</text></g>
<path transform="translate(61.4 684) scale(0.625)" d="M6 11h12a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="83.4" y="696" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">The browser never talks to Foliwake,</text>
<text x="83.4" y="715" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">and no credential reaches it.</text>
</svg>
