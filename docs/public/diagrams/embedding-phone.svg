<text x="86" y="756.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="start" letter-spacing=".04em">Browser</text>
<text x="54" y="786.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="start">&lt;FoliwakePage page&gt;</text>
<text x="54" y="807.2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">renders the body first</text></g>
