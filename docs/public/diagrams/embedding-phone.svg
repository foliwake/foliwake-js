<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1528" viewBox="0 0 360 1528" role="img" aria-labelledby="title desc">
<title id="title">Embedding: envelope, prepare, mount</title>
<desc id="desc">The browser opens /pages/x in your app. Your app's server reads /x.plain.html from the Foliwake origin with the credential and caches what it answered as the envelope. On every request preparePage checks and rewrites the body and returns FoliwakePageData. The browser renders the body with FoliwakePage, imports the blocks module through your app's code proxy, which fetches the immutable code release from the origin, and calls mountBlocks; blocks send events to your app.</desc>
<defs>
<linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#f2f5f8"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#effcf9"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaeb"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<radialGradient id="glow-teal"><stop offset="0" stop-color="#5eead4" stop-opacity="0.28"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-violet"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.26"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-amber"><stop offset="0" stop-color="#fcd34d" stop-opacity="0.18"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8z" fill="#94a3b8" stroke="#94a3b8" stroke-width="1" stroke-linejoin="round"/></marker>
</defs>
