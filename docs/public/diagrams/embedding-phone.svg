<text x="20" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Envelope, prepare, mount</text>
<text x="20" y="66" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Cache what the origin answered; prepare</text>
<text x="20" y="84" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">it on every request; mount blocks in</text>
<text x="20" y="102" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the browser.</text>
