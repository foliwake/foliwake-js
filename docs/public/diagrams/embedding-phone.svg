<text x="54" y="341.9" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">body, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.8">X-Code-Release</tspan>,</text>
<text x="54" y="360.4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">language, ETag</text></g>
