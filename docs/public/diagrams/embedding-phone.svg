<text x="126" y="498.4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="650" fill="#0f172a" text-anchor="start">Page</text>
<text x="126" y="519.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start">/x.plain.html</text></g>
