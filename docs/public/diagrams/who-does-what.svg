<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="title desc">
<title id="title">Who does what</title>
<desc id="desc">Authors write Markdown pages and block authors make Git commits. The Foliwake platform turns them into page HTML (path.plain.html with an X-Code-Release header) and code releases (components, scripts, styles). On your side, the app developer uses the SDK: on the server, @foliwake/server or /next reads pages, prepares them and proxies code; in the browser, @foliwake/client or /react mounts the blocks.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<rect width="760" height="456" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="380" y="36" font-size="23" font-weight="700" fill="#0f172a">Who does what</text>
<text x="380" y="62" font-size="15" fill="#475569">The platform renders and serves; the SDK runs on your side.</text>

<!-- Authors -->
<rect x="24" y="92" width="180" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="114" y="124" font-size="17" font-weight="650" fill="#0f172a">Author</text>
<text x="114" y="148" font-size="14" fill="#475569">Markdown pages</text>
<rect x="24" y="188" width="180" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="114" y="220" font-size="17" font-weight="650" fill="#0f172a">Block author</text>
<text x="114" y="244" font-size="14" fill="#475569">Git commit</text>

<path d="M206 130 H258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M206 226 H258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Platform -->
<rect x="264" y="92" width="200" height="172" rx="12" fill="#eef2ff" stroke="#818cf8"/>
<text x="364" y="134" font-size="18" font-weight="650" fill="#0f172a">Foliwake platform</text>
<text x="364" y="162" font-size="14" fill="#475569">renders pages,</text>
<text x="364" y="184" font-size="14" fill="#475569">captures code releases,</text>
<text x="364" y="206" font-size="14" fill="#475569">serves both</text>
<text x="364" y="240" font-size="13" fill="#64748b">not part of this SDK</text>

<path d="M466 130 H518" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M466 226 H518" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Outputs -->
<rect x="524" y="92" width="196" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="622" y="118" font-size="17" font-weight="650" fill="#0f172a">Page HTML</text>
<text x="622" y="140" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;path&gt;.plain.html</text>
<text x="622" y="158" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X-Code-Release: cd_…</text>
<rect x="524" y="188" width="196" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="622" y="214" font-size="17" font-weight="650" fill="#0f172a">Code release <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">cd_…</tspan></text>
<text x="622" y="236" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">components/, scripts/,</text>
<text x="622" y="254" font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">styles/, …</text>

<!-- Your side -->
<rect x="18" y="292" width="716" height="144" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="34" y="314" text-anchor="start" font-size="14" font-weight="650" fill="#334155">Your side: the SDK (this repository)</text>

<path d="M622 266 V324" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="630" y="284" text-anchor="start" font-size="12" fill="#475569">proxy</text>
<path d="M722 130 H748 V375 H726" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="742" y="284" text-anchor="end" font-size="12" fill="#475569">read</text>

<rect x="36" y="330" width="168" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="370" font-size="17" font-weight="650" fill="#0f172a">App developer</text>
<text x="120" y="394" font-size="14" fill="#475569">your app</text>

<path d="M206 375 H258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="366" font-size="12" fill="#475569">uses</text>

<rect x="264" y="330" width="200" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="364" y="356" font-size="17" font-weight="650" fill="#0f172a">In the browser</text>
<text x="364" y="378" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">@foliwake/client, /react</text>
<text x="364" y="402" font-size="14" fill="#475569">mount blocks</text>

<rect x="524" y="330" width="196" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="622" y="356" font-size="17" font-weight="650" fill="#0f172a">On your server</text>
<text x="622" y="378" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">@foliwake/server, /next</text>
<text x="622" y="402" font-size="14" fill="#475569">read, prepare, proxy</text>

<path d="M522 375 H470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="494" y="394" font-size="12" fill="#475569">page,</text>
<text x="494" y="408" font-size="12" fill="#475569">code</text>
</g>
</svg>
