<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" viewBox="0 0 760 488" role="img" aria-labelledby="title desc">
<title id="title">What you build: a Next app between the browser and Foliwake</title>
<desc id="desc">The browser talks only to your Next app. On the server, with the credential, the app serves three routes: /pages/path reads path.plain.html from Foliwake live or preview and caches it, /foliwake-code proxies the page's code release with its blocks, and /foliwake-media proxies pictures.</desc>
<defs>
<linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#f2f5f8"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#effcf9"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<linearGradient id="tint-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaeb"/><stop offset="1" stop-color="#f9fafc"/></linearGradient>
<radialGradient id="glow-teal"><stop offset="0" stop-color="#5eead4" stop-opacity="0.28"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-violet"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.26"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-amber"><stop offset="0" stop-color="#fcd34d" stop-opacity="0.18"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.2L8.6 5L1 8.8z" fill="#94a3b8" stroke="#94a3b8" stroke-width="1" stroke-linejoin="round"/></marker>
</defs>
<rect width="760" height="488" rx="20" fill="url(#canvas)"/>
<ellipse cx="91.2" cy="0" rx="342" ry="268.4" fill="url(#glow-teal)"/>
<ellipse cx="699.2" cy="439.2" rx="342" ry="292.8" fill="url(#glow-violet)"/>
<ellipse cx="570" cy="0" rx="228" ry="170.8" fill="url(#glow-amber)"/>
<rect x=".5" y=".5" width="759" height="487" rx="19.5" fill="none" stroke="#0f172a" stroke-opacity="0.07"/>
<text x="32" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">What you build</text>
<text x="32" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Your Next app reads and proxies on its server, with the credential.</text>
<rect x="200" y="104" width="368" height="312" rx="18" fill="#ffffff" fill-opacity="0.6" stroke="#2dd4bf" stroke-opacity=".45"/>
<rect x="212" y="116" width="172" height="24" rx="12" fill="#d5f5ef"/>
<path transform="translate(220 121) scale(0.583)" d="M5 4h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM5 13h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zM8 7.5h.01M8 16.5h.01" fill="none" stroke="#0f766e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="132.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="start" letter-spacing=".02em">Your Next app (server)</text>
<path d="M160 188 L216 188" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
<path d="M160 276 L216 276" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
