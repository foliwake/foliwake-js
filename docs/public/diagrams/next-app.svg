<rect x="76" y="218.5" width="40" height="40" rx="12" fill="#eef2f6"/><path transform="translate(84.4 226.9) scale(0.9670000000000001)" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5zM3 9h18M6.5 6.5h.01M9 6.5h.01" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="283.3" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Browser</text>
<text x="96" y="304.6" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">your app's pages</text></g>
<g><rect x="216" y="152" width="336" height="72" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="230" y="160.5" width="28" height="28" rx="8.4" fill="#d5f5ef"/><path transform="translate(235.9 166.4) scale(0.677)" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="268" y="179.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">/pages/&lt;path&gt;</text>
<text x="232" y="210.6" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">reads <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2">&lt;path&gt;.plain.html</tspan> (cached)</text></g>
<g><rect x="216" y="240" width="336" height="72" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="230" y="248.5" width="28" height="28" rx="8.4" fill="#d5f5ef"/><path transform="translate(235.9 254.4) scale(0.677)" d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="268" y="267.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">/foliwake-code/…</text>
<text x="232" y="298.6" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">proxies the page's code release (blocks)</text></g>
<g><rect x="216" y="328" width="336" height="72" rx="14" fill="url(#card)" stroke="#0f172a" stroke-opacity="0.09" filter="url(#shadow)"/>
<rect x="230" y="336.5" width="28" height="28" rx="8.4" fill="#d5f5ef"/><path transform="translate(235.9 342.4) scale(0.677)" d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM9 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM20 15l-4.5-4.5L6 20" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="268" y="355.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">/foliwake-media/…</text>
<text x="232" y="386.6" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">proxies pictures</text></g>
<g><rect x="608" y="136" width="120" height="256" rx="14" fill="url(#tint-violet)" stroke="#a78bfa" stroke-opacity=".55" filter="url(#shadow)"/>
<rect x="648" y="218.5" width="40" height="40" rx="12" fill="#ede9fe"/><path transform="translate(656.4 226.9) scale(0.9670000000000001)" d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.9 8.6 4.5 4.5 0 0 1 17.5 18.5z" fill="none" stroke="#6d28d9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="283.3" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Foliwake</text>
<text x="668" y="304.6" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">live / preview</text></g>
<path transform="translate(156.5 443) scale(0.667)" d="M6 11h12a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="178.5" y="456" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">The browser never talks to Foliwake, and no credential reaches it.</text>
</svg>
