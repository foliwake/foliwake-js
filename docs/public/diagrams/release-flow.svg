<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-labelledby="title desc">
<title id="title">From a commit to live code</title>
<desc id="desc">A commit pushed to a branch gives a branch preview with that branch's code and the preview content. A commit merged to main goes through site-check and becomes code release cd_N; the preview is rebuilt with it; the release, automatic or manual, then takes it live.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<rect width="760" height="392" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="380" y="36" font-size="23" font-weight="700" fill="#0f172a">From a commit to live code</text>
<text x="380" y="62" font-size="15" fill="#475569">New code reaches live only through the preview, where every page is rebuilt with it first.</text>

<!-- Commit -->
<rect x="24" y="92" width="120" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="84" y="128" font-size="17" font-weight="650" fill="#0f172a">Commit</text>

<!-- Branch lane -->
<path d="M146 122 H194" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="200" y="92" width="160" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="280" y="128" font-size="16" font-weight="650" fill="#0f172a">Push a branch</text>
<path d="M362 122 H414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="92" width="316" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="578" y="116" font-size="17" font-weight="650" fill="#0f172a">Branch preview</text>
<text x="578" y="138" font-size="13" fill="#475569">that branch's code, the preview content</text>

<!-- Main lane -->
<path d="M84 154 V226 H194" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="200" y="196" width="160" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="280" y="232" font-size="16" font-weight="650" fill="#0f172a">Merge to main</text>
<path d="M362 226 H414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="196" width="130" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="485" y="232" font-size="16" font-weight="650" fill="#0f172a">site-check</text>
<path d="M552 226 H600" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="606" y="196" width="130" height="60" rx="12" fill="#eef2ff" stroke="#818cf8"/>
<text x="671" y="220" font-size="16" font-weight="650" fill="#0f172a">Code release</text>
<text x="671" y="242" font-size="14" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cd_N</text>

<path d="M671 258 V294" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="536" y="300" width="200" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="636" y="324" font-size="16" font-weight="650" fill="#0f172a">Preview rebuilt</text>
<text x="636" y="346" font-size="13" fill="#475569">with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cd_N</tspan></text>

<path d="M534 330 H446" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490" y="320" font-size="12" fill="#475569">auto or manual</text>
<rect x="280" y="300" width="160" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="360" y="336" font-size="16" font-weight="650" fill="#0f172a">Release</text>

<path d="M278 330 H210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="300" width="180" height="60" rx="12" fill="#eef2ff" stroke="#818cf8"/>
<text x="114" y="336" font-size="17" font-weight="650" fill="#0f172a">Live</text>

</g>
</svg>
